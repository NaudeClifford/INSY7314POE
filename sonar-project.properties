sonar.projectName=HustleHub Part 3
sonar.sourceEncoding=UTF-8

# Analyze application code and keep test code separate from production code.
sonar.sources=Project/server,Project/client/src
sonar.tests=Project/server/test,Project/client/src/__tests__,Project/client/src/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,Project/server/test/**,Project/client/src/__tests__/**,Project/client/src/test/**
sonar.test.inclusions=Project/server/test/**,Project/client/src/__tests__/**,Project/client/src/test/**
# Keep Sonar's coverage scope aligned with c8, which deliberately omits one-off CLI scripts.
sonar.coverage.exclusions=Project/server/scripts/**
sonar.javascript.lcov.reportPaths=Project/server/coverage/lcov.info,Project/client/coverage/lcov.info
